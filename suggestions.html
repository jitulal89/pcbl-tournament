.querySelector('.mobile-bottom-nav');if(!nav)return;const more=nav.querySelector('.mobile-more');const btn=nav.querySelector('.mobile-more-btn');const menu=nav.querySelector('.mobile-more-menu');if(!more||!btn||!menu)return;function close(){menu.hidden=true;btn.setAttribute('aria-expanded','false');btn.classList.remove('active')}btn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();const open=menu.hidden;menu.hidden=!open;btn.setAttribute('aria-expanded',String(open));btn.classList.toggle('active',open)});menu.addEventListener('click',function(e){if(e.target.closest('a'))close()});document.addEventListener('click',function(e){if(!more.contains(e.target))close()});})();</script></body></html>
