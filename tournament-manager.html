<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tournament Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10}.brand{font-weight:800;font-size:19px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{border:1px solid #ffffff33;background:#ffffff12;color:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.nav button:hover{background:#ffffff25}main{max-width:1180px;margin:auto;padding:24px 16px}.hero{background:linear-gradient(135deg,#111827,#334155);color:#fff;border-radius:20px;padding:30px;margin-bottom:20px}.hero h1{font-size:clamp(32px,6vw,54px);margin:8px 0}.hero p{color:#d1d5db;max-width:760px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:18px;box-shadow:0 4px 18px #00000008}.card h2,.card h3{margin-top:0}.btn{border:0;border-radius:9px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:750;cursor:pointer}.btn.secondary{background:#e5e7eb;color:#111827}.btn.success{background:#15803d}.btn.danger{background:#dc2626}.btn:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 13px;background:#fff;font:inherit}label{font-size:13px;font-weight:750}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:#667085}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:750;background:#eef2ff;color:#3730a3}.pill.green{background:#dcfce7;color:#166534}.pill.red{background:#fee2e2;color:#991b1b}.pill.amber{background:#fef3c7;color:#92400e}.stat{font-size:30px;font-weight:850}.msg{padding:11px;border-radius:9px;margin:10px 0}.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#991b1b}.tabs{display:flex;gap:7px;overflow:auto;margin:15px 0}.tabs button{white-space:nowrap;border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.tabs button.active{background:#111827;color:#fff}.list{border-top:1px solid #eee}.item{padding:13px 0;border-bottom:1px solid #eee}.small{font-size:12px}.copybox{background:#f8fafc;border:1px dashed #cbd5e1;padding:10px;border-radius:9px;word-break:break-all}.empty{padding:25px;text-align:center;color:#667085}.check{display:flex;align-items:center;gap:8px;margin:8px 0}.check input{width:auto;margin:0}.dangerText{color:#b91c1c}@media(max-width:650px){main{padding:16px 10px}.card{padding:14px}.nav button{padding:7px 9px}.hero{padding:24px 18px}}
</style>
</head>
<body>
<header><div class="brand">🏆 Tournament Manager</div><div class="nav"><button onclick="go('#/')">Home</button><button onclick="go('#/tournaments')">My Tournaments</button><button id="loginBtn" onclick="go('#/login')">Login</button><button id="logoutBtn" class="hidden" onclick="logout()">Logout</button></div></header>
<main id="app"></main>
<script>
const SUPABASE_URL='https://bfalondvpfijthberomf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_kiyREqgce0B0-IZ8jOUkdQ_w8pas2ae';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const go=h=>location.hash=h;const msg=(x,c='ok')=>`<div class="msg ${c}">${esc(x)}</div>`;
async function session(){const {data}=await sb.auth.getSession();return data.session}async function nav(){const s=await session();loginBtn.classList.toggle('hidden',!!s);logoutBtn.classList.toggle('hidden',!s)}async function logout(){await sb.auth.signOut();go('#/');nav()}
async function isAdmin(tid=null){const {data:{user}}=await sb.auth.getUser();if(!user)return false;if(!tid)return true;const {data}=await sb.from('tournament_members').select('role').eq('tournament_id',tid).eq('user_id',user.id).maybeSingle();return ['owner','admin'].includes(data?.role)}
function home(){app.innerHTML=`<section class="hero"><span class="pill">PHASE 1 COMPLETE</span><h1>One platform for every tournament</h1><p>Create tournaments, configure events, open registration, collect participants, approve them and create category entries — while keeping your existing PCBL 2026 data separate.</p><div class="row"><button class="btn" onclick="go('#/tournaments')">Open Tournament Manager</button><button class="btn secondary" onclick="go('#/login')">Admin Login</button></div></section><div class="grid"><div class="card"><h3>🏆 Tournament Setup</h3><p class="muted">Name, venue, dates, status and tournament-specific categories.</p></div><div class="card"><h3>📝 Public Registration</h3><p class="muted">Share one registration link and collect player details.</p></div><div class="card"><h3>👥 Participants</h3><p class="muted">Approve, reject and manage tournament registrations.</p></div><div class="card"><h3>🎯 Category Entries</h3><p class="muted">Put approved players into Singles, Doubles, Mixed or Team categories.</p></div></div>`}
function login(){app.innerHTML=`<div class="card" style="max-width:460px;margin:30px auto"><h2>Admin Login</h2><div id="lm"></div><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="btn" onclick="doLogin()">Sign in</button></div>`}
async function doLogin(){const m=document.getElementById('lm');const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){m.innerHTML=msg(error.message,'err');return}go('#/tournaments')}
async function tournaments(){if(!await session()){go('#/login');return}const {data,error}=await sb.from('tournaments').select('id,name,venue,start_date,end_date,status,created_at,created_by').order('created_at',{ascending:false});if(error){app.innerHTML=`<div class="card">${msg(error.message,'err')}</div>`;return}app.innerHTML=`<div class="row between"><div><h1>My Tournaments</h1><p class="muted">Create and manage your tournaments.</p></div><button class="btn" onclick="go('#/tournaments/create')">+ Create Tournament</button></div><div class="grid">${(data||[]).map(t=>`<div class="card"><span class="pill">${esc(t.status)}</span><h3>${esc(t.name)}</h3><p class="muted">${esc(t.venue||'Venue not set')}</p><p>${esc(t.start_date||'Date not set')}${t.end_date?' → '+esc(t.end_date):''}</p><button class="btn" onclick="go('#/tournament/${t.id}')">Manage</button></div>`).join('')||'<div class="card empty">No tournaments yet.</div>'}</div>`}
function createTournament(){app.innerHTML=`<div class="card" style="max-width:680px;margin:auto"><h2>Create Tournament</h2><p class="muted">The signed-in user becomes the Owner.</p><div id="cm"></div><label>Tournament name *</label><input id="tn" placeholder="Park Connect Championship 2027"><label>Venue</label><input id="tv" placeholder="Park Connect"><div class="grid"><div><label>Start date</label><input id="ts" type="date"></div><div><label>End date</label><input id="te" type="date"></div></div><div class="row"><button class="btn secondary" onclick="go('#/tournaments')">Cancel</button><button class="btn" onclick="create()">Create Tournament</button></div></div>`}
async function create(){const m=document.getElementById('cm');if(!tn.value.trim()){m.innerHTML=msg('Tournament name is required.','err');return}const {data,error}=await sb.rpc('create_generic_tournament',{p_name:tn.value.trim(),p_venue:tv.value.trim()||null,p_start_date:ts.value||null,p_end_date:te.value||null});if(error){m.innerHTML=msg(error.message,'err');return}go('#/tournament/'+data.id)}
async function manage(id){if(!await isAdmin(id)){go('#/login');return}const [{data:t,error:te},{data:cats,error:ce},{data:regs,error:re},{data:entries,error:ee},{data:form}]=await Promise.all([sb.from('tournaments').select('*').eq('id',id).single(),sb.from('tournament_categories').select('*').eq('tournament_id',id).order('display_order'),sb.from('tournament_registrations').select('*').eq('tournament_id',id).order('submitted_at',{ascending:false}),sb.from('tournament_entries').select('id,category_id,registration_id,status,seed').eq('tournament_id',id),sb.from('registration_forms').select('*').eq('tournament_id',id).maybeSingle()]);if(te){app.innerHTML=`<div class="card">${msg(te.message,'err')}</div>`;return}const pending=(regs||[]).filter(x=>x.status==='pending').length,approved=(regs||[]).filter(x=>x.status==='approved').length;app.innerHTML=`<div class="row between"><div><h1>${esc(t.name)}</h1><p class="muted">${esc(t.venue||'')} ${t.start_date?'· '+esc(t.start_date):''}</p></div><button class="btn secondary" onclick="go('#/tournaments')">← Back</button></div><div class="grid"><div class="card"><div class="stat">${regs?.length||0}</div><div class="muted">Registrations</div></div><div class="card"><div class="stat">${pending}</div><div class="muted">Pending</div></div><div class="card"><div class="stat">${approved}</div><div class="muted">Approved</div></div><div class="card"><div class="stat">${entries?.length||0}</div><div class="muted">Category Entries</div></div></div><div class="tabs"><button class="active" onclick="tab('setup')">⚙️ Setup</button><button onclick="tab('registration')">📝 Registration</button><button onclick="tab('participants')">👥 Participants</button><button onclick="tab('entries')">🎯 Entries</button></div><section id="setupTab">${setupHtml(t,cats||[],form)}</section><section id="registrationTab" class="hidden">${registrationHtml(t,form)}</section><section id="participantsTab" class="hidden">${participantsHtml(regs||[],cats||[],entries||[])}</section><section id="entriesTab" class="hidden">${entriesHtml(cats||[],regs||[],entries||[])}</section>`}
function tab(name){['setup','registration','participants','entries'].forEach(x=>document.getElementById(x+'Tab').classList.toggle('hidden',x!==name));document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',['setup','registration','participants','entries'][i]===name))}
function setupHtml(t,cats,form){return `<div class="card"><h2>Tournament Setup</h2><div id="setupMsg"></div><div class="grid"><div><label>Status</label><select id="tourStatus"><option value="draft">Draft</option><option value="live">Live</option><option value="completed">Completed</option></select></div><div><label>Venue</label><input id="tourVenue" value="${esc(t.venue||'')}"></div></div><button class="btn" onclick="saveTournament('${t.id}')">Save Tournament</button></div><div class="card" style="margin-top:15px"><div class="row between"><div><h2>Categories</h2><p class="muted">Configure the events participants can enter.</p></div></div><div id="catMsg"></div><div class="grid"><div><label>Category name *</label><input id="catName" placeholder="Mixed Open"></div><div><label>Event type</label><select id="catType"><option value="singles">Singles</option><option value="doubles">Doubles</option><option value="team">Team</option></select></div><div><label>Format</label><select id="catFormat"><option value="knockout">Knockout</option><option value="league">League</option><option value="league_finals">League + Finals</option></select></div><div><label>Gender</label><select id="catGender"><option value="open">Open</option><option value="male">Male</option><option value="female">Female</option><option value="mixed">Mixed</option></select></div><div><label>Min age</label><input id="catMin" type="number" min="0"></div><div><label>Max age</label><input id="catMax" type="number" min="0"></div><div><label>Max entries</label><input id="catMaxEntries" type="number" min="1"></div></div><button class="btn" onclick="addCategory('${t.id}')">+ Add Category</button><div class="list" style="margin-top:12px">${cats.map(c=>`<div class="item"><div class="row between"><div><strong>${esc(c.name)}</strong><br><span class="muted small">${esc(c.event_type)} · ${esc(c.format_type)} · ${esc(c.gender_rule)}${c.min_age!=null?' · '+c.min_age+'+':''}${c.max_age!=null?' – '+c.max_age:''}</span></div><button class="btn danger" onclick="deleteCategory('${c.id}','${t.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No categories yet.</div>'}</div></div>`}
function registrationHtml(t,form){const enabled=form?.public_enabled===true;const link=location.origin+location.pathname+'#/register/'+t.id;return `<div class="card"><h2>Public Registration</h2><p class="muted">Turn registration on only after your categories are ready.</p><div id="regSetupMsg"></div><label>Registration status</label><select id="regEnabled"><option value="false">Closed</option><option value="true">Open</option></select><label>Instructions</label><textarea id="regInstructions" rows="4" placeholder="Please enter your details accurately.">${esc(form?.instructions||'')}</textarea><div class="grid"><label class="check"><input id="rqPhone" type="checkbox"> Phone required</label><label class="check"><input id="rqEmail" type="checkbox"> Email required</label><label class="check"><input id="rqGender" type="checkbox"> Gender required</label><label class="check"><input id="rqDob" type="checkbox"> Date of birth required</label><label class="check"><input id="rqCH" type="checkbox"> CricHeroes required</label></div><button class="btn" onclick="saveRegistrationForm('${t.id}')">Save Registration Settings</button>${enabled?`<hr><h3>Share Registration Link</h3><div class="copybox" id="shareLink">${esc(link)}</div><div class="row" style="margin-top:10px"><button class="btn" onclick="copyText(document.getElementById('shareLink').textContent)">Copy Link</button><button class="btn secondary" onclick="go('#/register/${t.id}')">Open Registration</button></div>`:''}</div>`}
function participantsHtml(regs,cats,entries){return `<div class="card"><div class="row between"><div><h2>Participants</h2><p class="muted">Review every registration and add approved players to event categories.</p></div><span class="pill">${regs.length} total</span></div><div class="list">${regs.map(r=>`<div class="item"><div class="row between"><div><strong>${esc(r.display_name||r.full_name)}</strong> ${r.gender?`<span class="pill">${esc(r.gender)}</span>`:''}<br><span class="muted small">${esc(r.phone||'No phone')} · ${esc(r.email||'No email')} · ${esc(r.playing_role||'Role not provided')}</span>${r.cricheroes_url?`<br><a href="${esc(r.cricheroes_url)}" target="_blank" rel="noopener">CricHeroes ↗</a>`:''}</div><span class="pill ${r.status==='approved'?'green':r.status==='rejected'?'red':'amber'}">${esc(r.status)}</span></div><div class="row" style="margin-top:9px">${r.status==='pending'?`<button class="btn success" onclick="updateRegistration('${r.id}','approved')">Approve</button><button class="btn danger" onclick="updateRegistration('${r.id}','rejected')">Reject</button>`:''}${r.status==='approved'?`<button class="btn secondary" onclick="quickEntry('${r.id}')">Add to Category</button>`:''}</div></div>`).join('')||'<div class="empty">No registrations yet.</div>'}</div></div>`}
function entriesHtml(cats,regs,entries){return `<div class="card"><h2>Category Entries</h2><p class="muted">Phase 1 supports individual entries. Doubles/team composition and automatic draw come in the next phase.</p>${cats.map(c=>{const es=entries.filter(e=>e.category_id===c.id);return `<div class="item"><div class="row between"><div><strong>${esc(c.name)}</strong><br><span class="muted small">${esc(c.event_type)} · ${esc(c.format_type)}</span></div><span class="pill">${es.length}${c.max_entries?' / '+c.max_entries:''}</span></div><div style="margin-top:9px">${es.map(e=>{const r=regs.find(x=>x.id===e.registration_id);return `<div class="row between" style="padding:7px 0;border-top:1px solid #f1f5f9"><span>${esc(r?.display_name||r?.full_name||'Unknown')}</span><button class="btn danger" onclick="removeEntry('${e.id}')">Remove</button></div>`}).join('')||'<span class="muted">No entries.</span>'}</div></div>`}).join('')||'<div class="empty">Create a category first.</div>'}</div>`}
async function saveTournament(id){const {error}=await sb.from('tournaments').update({status:tourStatus.value,venue:tourVenue.value.trim()||null}).eq('id',id);document.getElementById('setupMsg').innerHTML=error?msg(error.message,'err'):msg('Tournament settings saved.');}
async function addCategory(tid){const m=document.getElementById('catMsg');if(!catName.value.trim()){m.innerHTML=msg('Category name is required.','err');return}const {data:last}=await sb.from('tournament_categories').select('display_order').eq('tournament_id',tid).order('display_order',{ascending:false}).limit(1);const order=(last?.[0]?.display_order||0)+1;const {error}=await sb.from('tournament_categories').insert({tournament_id:tid,name:catName.value.trim(),display_order:order,event_type:catType.value,format_type:catFormat.value,gender_rule:catGender.value,min_age:catMin.value?Number(catMin.value):null,max_age:catMax.value?Number(catMax.value):null,max_entries:catMaxEntries.value?Number(catMaxEntries.value):null,registration_open:false,status:'draft'});if(error){m.innerHTML=msg(error.message,'err');return}manage(tid)}
async function deleteCategory(cid,tid){if(!confirm('Delete this category?'))return;const {error}=await sb.from('tournament_categories').delete().eq('id',cid);if(error)alert(error.message);else manage(tid)}
async function saveRegistrationForm(tid){const m=document.getElementById('regSetupMsg');const patch={public_enabled:regEnabled.value==='true',instructions:regInstructions.value.trim()||null,require_phone:rqPhone.checked,require_email:rqEmail.checked,require_gender:rqGender.checked,require_date_of_birth:rqDob.checked,require_cricheroes:rqCH.checked,updated_at:new Date().toISOString()};const {error}=await sb.from('registration_forms').update(patch).eq('tournament_id',tid);if(error){m.innerHTML=msg(error.message,'err');return}manage(tid)}
async function updateRegistration(id,status){const {data:{user}}=await sb.auth.getUser();const {data:r}=await sb.from('tournament_registrations').select('tournament_id').eq('id',id).single();const {error}=await sb.from('tournament_registrations').update({status,reviewed_at:new Date().toISOString(),reviewed_by:user?.id||null}).eq('id',id);if(error)alert(error.message);else manage(r.tournament_id)}
async function quickEntry(regId){const {data:r}=await sb.from('tournament_registrations').select('tournament_id').eq('id',regId).single();const {data:cats}=await sb.from('tournament_categories').select('id,name,event_type').eq('tournament_id',r.tournament_id).order('display_order');const name=prompt('Enter category name:\n'+(cats||[]).map(c=>c.name).join(', '));const c=(cats||[]).find(x=>x.name.toLowerCase()===String(name||'').trim().toLowerCase());if(!c){alert('Category not found.');return}await addEntry(c.id,regId,r.tournament_id)}
async function addEntry(cid,rid,tid){const {data:r}=await sb.from('tournament_registrations').select('status').eq('id',rid).single();if(r?.status!=='approved'){alert('Only approved participants can be entered.');return}const {data:c}=await sb.from('tournament_categories').select('max_entries').eq('id',cid).single();if(c?.max_entries){const {count}=await sb.from('tournament_entries').select('id',{count:'exact',head:true}).eq('category_id',cid).eq('status','confirmed');if(count>=c.max_entries){alert('This category has reached its maximum entries.');return}}const {error}=await sb.from('tournament_entries').insert({tournament_id:tid,category_id:cid,registration_id:rid,status:'confirmed'});if(error)alert(error.message);else manage(tid)}
async function removeEntry(id){if(!confirm('Remove this category entry?'))return;const {data:e}=await sb.from('tournament_entries').select('tournament_id').eq('id',id).single();const {error}=await sb.from('tournament_entries').delete().eq('id',id);if(error)alert(error.message);else manage(e.tournament_id)}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert('Link copied.')}catch{prompt('Copy this link:',t)}}
async function publicRegister(tid){const [{data:t},{data:f},{data:cats}]=await Promise.all([sb.from('tournaments').select('*').eq('id',tid).single(),sb.from('registration_forms').select('*').eq('tournament_id',tid).maybeSingle(),sb.from('tournament_categories').select('*').eq('tournament_id',tid).eq('registration_open',true).order('display_order')]);if(!t||!f?.public_enabled){app.innerHTML='<div class="card empty">Registration is currently closed.</div>';return}app.innerHTML=`<div class="card" style="max-width:760px;margin:auto"><div class="row"><div style="font-size:42px">🏆</div><div><h2>${esc(t.name)}</h2><p class="muted">Player Registration</p></div></div><p>${esc(f.instructions||'Please complete the registration form.')}</p><div id="publicMsg"></div><div class="grid"><div><label>Full name *</label><input id="rName"></div><div><label>Display name</label><input id="rDisplay"></div><div><label>Gender ${f.require_gender?'*':''}</label><select id="rGender"><option value="">Select</option><option value="M">Male</option><option value="F">Female</option><option value="O">Other</option></select></div><div><label>Date of birth ${f.require_date_of_birth?'*':''}</label><input id="rDob" type="date"></div><div><label>Phone ${f.require_phone?'*':''}</label><input id="rPhone" type="tel"></div><div><label>Email ${f.require_email?'*':''}</label><input id="rEmail" type="email"></div><div><label>City</label><input id="rCity"></div><div><label>Playing role</label><select id="rRole"><option value="">Select</option><option>Batsman</option><option>Bowler</option><option>All-rounder</option><option>Wicket keeper</option></select></div><div><label>Batting style</label><select id="rBat"><option value="">Select</option><option>Right hand</option><option>Left hand</option></select></div><div><label>Bowling style</label><input id="rBowl" placeholder="Right arm medium"></div><div style="grid-column:1/-1"><label>CricHeroes URL ${f.require_cricheroes?'*':''}</label><input id="rCH" type="url" placeholder="https://cricheroes.com/..."></div></div><h3>Category</h3><select id="rCat"><option value="">Select category</option>${(cats||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="btn" onclick="submitPublic('${tid}')">Submit Registration</button></div>`}
async function submitPublic(tid){const m=document.getElementById('publicMsg');const {data:f}=await sb.from('registration_forms').select('*').eq('tournament_id',tid).single();if(!rName.value.trim()){m.innerHTML=msg('Full name is required.','err');return}if(f.require_phone&&!rPhone.value.trim()){m.innerHTML=msg('Phone is required.','err');return}if(f.require_email&&!rEmail.value.trim()){m.innerHTML=msg('Email is required.','err');return}if(f.require_gender&&!rGender.value){m.innerHTML=msg('Gender is required.','err');return}if(f.require_date_of_birth&&!rDob.value){m.innerHTML=msg('Date of birth is required.','err');return}if(f.require_cricheroes&&!rCH.value.trim()){m.innerHTML=msg('CricHeroes profile is required.','err');return}const {data:r,error}=await sb.from('tournament_registrations').insert({tournament_id:tid,full_name:rName.value.trim(),display_name:rDisplay.value.trim()||null,gender:rGender.value||null,date_of_birth:rDob.value||null,phone:rPhone.value.trim()||null,email:rEmail.value.trim()||null,city:rCity.value.trim()||null,playing_role:rRole.value||null,batting_style:rBat.value||null,bowling_style:rBowl.value.trim()||null,cricheroes_url:rCH.value.trim()||null}).select().single();if(error){m.innerHTML=msg(error.message,'err');return}if(rCat.value){const {error:e}=await sb.from('tournament_entries').insert({tournament_id:tid,category_id:rCat.value,registration_id:r.id,status:'pending'});if(e){m.innerHTML=msg('Registration saved, but category selection failed: '+e.message,'err');return}}app.innerHTML=`<div class="card empty" style="max-width:650px;margin:40px auto"><div style="font-size:52px">✅</div><h2>Registration submitted</h2><p>Your registration is pending administrator approval.</p><button class="btn" onclick="go('#/tournament/${tid}')">Back</button></div>`}
async function publicTournament(tid){const [{data:t},{data:cats}]=await Promise.all([sb.from('tournaments').select('*').eq('id',tid).single(),sb.from('tournament_categories').select('*').eq('tournament_id',tid).order('display_order')]);if(!t){app.innerHTML='<div class="card empty">Tournament not found.</div>';return}app.innerHTML=`<section class="hero"><span class="pill">${esc(t.status)}</span><h1>${esc(t.name)}</h1><p>${esc(t.venue||'')} ${t.start_date?'· '+esc(t.start_date):''}</p><button class="btn" onclick="go('#/register/${tid}')">Player Registration</button></section><div class="card"><h2>Events</h2>${(cats||[]).map(c=>`<div class="item"><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.event_type)} · ${esc(c.format_type)} · ${esc(c.gender_rule)}</span></div>`).join('')||'<div class="empty">Events will be announced soon.</div>'}</div>`}
async function router(){await nav();const p=(location.hash||'#/').slice(2).split('/').filter(Boolean);if(!p.length)return home();if(p[0]==='login')return login();if(p[0]==='tournaments'&&p[1]==='create')return createTournament();if(p[0]==='tournaments')return tournaments();if(p[0]==='register'&&p[1])return publicRegister(p[1]);if(p[0]==='tournament'&&p[1]){const s=await session();return s&&await isAdmin(p[1])?manage(p[1]):publicTournament(p[1])}return home()}
addEventListener('hashchange',router);sb.auth.onAuthStateChange(()=>nav());router();
</script>
</body></html>
