<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournament Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.nav button{background:#ffffff18;color:#fff}.btn{background:#2563eb;color:#fff}.secondary{background:#e5e7eb;color:#111827}main{max-width:1100px;margin:auto;padding:24px 16px}.hero{background:linear-gradient(135deg,#111827,#334155);color:#fff;border-radius:20px;padding:30px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:18px;box-shadow:0 4px 18px #00000008}input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 13px;font:inherit}label{font-weight:700;font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#667085}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.hidden{display:none!important}.msg{padding:11px;border-radius:9px;margin:10px 0}.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#991b1b}</style></head><body><header><b>🏆 Tournament Manager</b><div class="nav"><button onclick="go('#/')">Home</button><button onclick="go('#/tournaments')">My Tournaments</button><button id="login" onclick="go('#/login')">Login</button><button id="logout" class="hidden" onclick="sb.auth.signOut().then(()=>go('#/'))">Logout</button></div></header><main id="app"></main><script>
const sb=supabase.createClient('https://bfalondvpfijthberomf.supabase.co','sb_publishable_kiyREqgce0B0-IZ8jOUkdQ_w8pas2ae');const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const go=h=>location.hash=h;const M=(x,c='ok')=>`<div class="msg ${c}">${esc(x)}</div>`;
async function nav(){const {data}=await sb.auth.getSession();login.classList.toggle('hidden',!!data.session);logout.classList.toggle('hidden',!data.session)}
function home(){app.innerHTML=`<section class="hero"><span class="pill">PHASE 1</span><h1>One platform for every tournament</h1><p>Create tournaments and categories while keeping PCBL 2026 untouched.</p><button class="btn" onclick="go('#/tournaments')">Open Manager</button></section><div class="grid"><div class="card"><h3>🏆 Multiple tournaments</h3><p class="muted">Each tournament is isolated by tournament_id.</p></div><div class="card"><h3>🗂 Categories</h3><p class="muted">Singles, doubles, team, age groups and configurable formats.</p></div><div class="card"><h3>👥 Participants</h3><p class="muted">Reusable participant records can later enter multiple events.</p></div></div>`}
function loginPage(){app.innerHTML=`<div class="card" style="max-width:460px;margin:30px auto"><h2>Admin Login</h2><div id="m"></div><label>Email</label><input id="email" type="email"><label>Password</label><input id="pass" type="password"><button class="btn" onclick="loginNow()">Sign in</button></div>`}async function loginNow(){const m=document.getElementById('m');const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(error)m.innerHTML=M(error.message,'err');else go('#/tournaments')}
async function tournaments(){const {data:s}=await sb.auth.getSession();if(!s.session)return go('#/login');const {data,error}=await sb.from('tournaments').select('id,name,venue,start_date,end_date,status,created_at').order('created_at',{ascending:false});if(error)return app.innerHTML=`<div class="card">${M(error.message,'err')}</div>`;app.innerHTML=`<div class="row" style="justify-content:space-between"><div><h1>My Tournaments</h1><p class="muted">Create and manage tournaments.</p></div><button class="btn" onclick="go('#/tournaments/create')">+ Create Tournament</button></div><div class="grid">${(data||[]).map(t=>`<div class="card"><span class="pill">${esc(t.status)}</span><h3>${esc(t.name)}</h3><p class="muted">${esc(t.venue||'Venue not set')}</p><p>${esc(t.start_date||'Date not set')}</p><button class="btn" onclick="go('#/tournament/${t.id}')">Manage</button></div>`).join('')}</div>`}
function createPage(){app.innerHTML=`<div class="card" style="max-width:650px;margin:auto"><h2>Create Tournament</h2><p class="muted">Uses a secure RPC to create the tournament and first Owner membership.</p><div id="cm"></div><label>Name *</label><input id="tn" placeholder="Park Connect Championship 2027"><label>Venue</label><input id="tv"><label>Start</label><input id="ts" type="date"><label>End</label><input id="te" type="date"><button class="btn" onclick="createNow()">Create</button></div>`}async function createNow(){const m=document.getElementById('cm');if(!tn.value.trim())return m.innerHTML=M('Tournament name is required.','err');const {data,error}=await sb.rpc('create_generic_tournament',{p_name:tn.value.trim(),p_venue:tv.value.trim()||null,p_start_date:ts.value||null,p_end_date:te.value||null});if(error)m.innerHTML=M(error.message,'err');else go('#/tournament/'+data.id)}
async function manage(id){const {data:t,error:te}=await sb.from('tournaments').select('*').eq('id',id).single();if(te)return app.innerHTML=`<div class="card">${M(te.message,'err')}</div>`;const {data:cats}=await sb.from('tournament_categories').select('*').eq('tournament_id',id).order('display_order');app.innerHTML=`<div class="row" style="justify-content:space-between"><div><h1>${esc(t.name)}</h1><p class="muted">${esc(t.venue||'')}</p></div><button class="btn secondary" onclick="go('#/tournaments')">← Back</button></div><div class="card"><h2>Add Category</h2><div id="catm"></div><div class="grid"><div><label>Name</label><input id="cn" placeholder="Mixed Open"></div><div><label>Event type</label><select id="et"><option value="singles">Singles</option><option value="doubles">Doubles</option><option value="team">Team</option></select></div><div><label>Format</label><select id="ft"><option value="knockout">Knockout</option><option value="league">League</option><option value="league_finals">League + Finals</option></select></div><div><label>Gender</label><select id="gr"><option value="open">Open</option><option value="male">Male</option><option value="female">Female</option><option value="mixed">Mixed</option></select></div><div><label>Min age</label><input id="mina" type="number"></div><div><label>Max age</label><input id="maxa" type="number"></div></div><button class="btn" onclick="addCat('${id}')">Add Category</button></div><div class="card" style="margin-top:16px"><h2>Categories</h2>${(cats||[]).map(c=>`<div style="padding:12px 0;border-top:1px solid #eee"><b>${esc(c.name)}</b><br><span class="muted">${esc(c.event_type)} · ${esc(c.format_type)} · ${esc(c.gender_rule)}${c.min_age?' · '+c.min_age+'+':''}</span></div>`).join('')||'<p class="muted">No categories yet.</p>'}</div>`}
async function addCat(id){const m=document.getElementById('catm');if(!cn.value.trim())return m.innerHTML=M('Category name is required.','err');const {data:last}=await sb.from('tournament_categories').select('display_order').eq('tournament_id',id).order('display_order',{ascending:false}).limit(1);const order=(last?.[0]?.display_order||0)+1;const {error}=await sb.from('tournament_categories').insert({tournament_id:id,name:cn.value.trim(),display_order:order,event_type:et.value,format_type:ft.value,gender_rule:gr.value,min_age:mina.value?Number(mina.value):null,max_age:maxa.value?Number(maxa.value):null,status:'draft',registration_open:false});if(error)m.innerHTML=M(error.message,'err');else manage(id)}
async function router(){await nav();const p=(location.hash||'#/').slice(2).split('/').filter(Boolean);if(!p.length)return home();if(p[0]=='login')return loginPage();if(p[0]=='tournaments'&&p[1]=='create')return createPage();if(p[0]=='tournaments')return tournaments();if(p[0]=='tournament'&&p[1])return manage(p[1]);home()}addEventListener('hashchange',router);router();
</script></body></html>
