<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Players</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-common.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--primary:#2563eb;--dark:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
header{background:#111827;color:#fff;padding:13px 16px;position:sticky;top:0;z-index:30}
.headbar{max-width:1500px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:800;font-size:18px}.topactions{display:flex;gap:7px;align-items:center}
button,.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none}.light{background:#fff;color:#111827;border:1px solid #d1d5db}.primary{background:#2563eb;color:#fff}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
.layout{max-width:1500px;margin:auto;display:flex;min-height:calc(100vh - 58px)}
aside{width:230px;background:#fff;border-right:1px solid var(--line);padding:10px;flex-shrink:0}.nav{display:flex;flex-direction:column;gap:4px}.nav a{padding:11px 12px;border-radius:9px;color:#374151;text-decoration:none;font-weight:750}.nav a:hover,.nav a.active{background:#eff6ff;color:#1d4ed8}
main{flex:1;padding:20px;min-width:0}.title h1{margin:0 0 4px;font-size:30px}.muted{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:15px;box-shadow:0 5px 20px #0f172a0a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:28px;margin-top:4px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.toolbar>*{min-width:180px}input,select,textarea{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:8px;background:#fff}label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.table{border-collapse:collapse;width:100%;min-width:800px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{background:#f8fafc;color:#667085;font-size:11px}
.badge{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;background:#e5e7eb}.approved,.completed,.ready,.confirmed{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.rejected{background:#fee2e2;color:#991b1b}
.notice{padding:11px;border-radius:9px;background:#eff6ff;color:#1e40af;margin-bottom:12px}.notice.error{background:#fef2f2;color:#991b1b}.empty{text-align:center;color:var(--muted);padding:25px}
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.player{border:1px solid var(--line);border-radius:13px;background:#fff;overflow:hidden;cursor:pointer}.avatar{height:120px;background:#eaf0f8;display:flex;align-items:center;justify-content:center;font-size:42px}.avatar img{width:100%;height:100%;object-fit:cover}.pbody{padding:12px}.record{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}.record div{background:#f8fafc;text-align:center;padding:6px;border-radius:7px}.record b{display:block;font-size:17px}.record span{font-size:9px;color:var(--muted)}
.bracket{display:flex;gap:24px;overflow:auto}.round{min-width:235px}.round h3{text-align:center;color:var(--muted);font-size:13px}.match{border:1px solid #dbe1ea;border-radius:9px;overflow:hidden;background:#fff;margin:14px 0}.side{padding:9px;min-height:36px}.side+.side{border-top:1px solid #edf0f4}.winner{background:#f0fdf4;font-weight:800}.matchfoot{padding:7px;background:#f8fafc;font-size:11px;color:#667085;display:flex;justify-content:space-between}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.modal.open{display:flex}.modalbox{background:#fff;border-radius:15px;padding:20px;width:min(760px,100%);max-height:90vh;overflow:auto}
@media(max-width:900px){.layout{display:block}aside{width:100%;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:20}.nav{flex-direction:row;overflow-x:auto}.nav a{white-space:nowrap;min-width:max-content}.grid{grid-template-columns:1fr 1fr}.players{grid-template-columns:1fr 1fr}main{padding:12px}}
@media(max-width:550px){.grid{grid-template-columns:1fr}.players{grid-template-columns:1fr}.form{grid-template-columns:1fr}.topactions .email{display:none}}
</style></head><body>
<header><div class="headbar"><div class="brand">🏸 Badminton Admin</div><div class="topactions"><span id="userEmail" class="email muted"></span><button class="light" onclick="publicView()">🌐 Public</button><button class="light" onclick="signOut()">↪ Sign out</button></div></div></header>
<div class="layout"><aside><div id="nav" class="nav"></div></aside><main><div id="msg"></div><div class="title"><h1 id="tournamentName">Players</h1><div class="muted">Badminton Tournament Management</div></div><br><div class="toolbar"><input id="q" placeholder="Search player or city..." oninput="render()"><select id="cat" onchange="render()"><option value="">All events</option></select></div><div id="grid" class="players"></div>
<div id="modal" class="modal"><div class="modalbox"><h2 id="mt"></h2><div id="mb"></div><button class="btn light" onclick="$('modal').classList.remove('open')">Close</button></div></div></main></div>
<script>
(async()=>{if(!(await requireSession()))return;if(!(await loadTournament()))return;setupHeader('players');await loadData();$('cat').innerHTML='<option value="">All events</option>'+categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');render()})();
function pEntries(pid){return entries.filter(e=>entryMembers(e).some(p=>p.id===pid))}
function pMatches(pid){let ids=new Set(pEntries(pid).map(e=>e.id));return matches.filter(m=>ids.has(m.entry_a_id)||ids.has(m.entry_b_id))}
function stats(pid){let ms=pMatches(pid),done=ms.filter(m=>m.status==='completed'),wins=done.filter(m=>m.winner_entry_id&&entryMembers(entries.find(e=>e.id===m.winner_entry_id)).some(p=>p.id===pid));return [done.length,wins.length,done.length-wins.length]}
function render(){let q=($('q').value||'').toLowerCase(),cid=$('cat').value;let ps=registrations.filter(p=>p.status==='approved'&&(!q||(`${p.full_name} ${p.city||''}`).toLowerCase().includes(q))&&(!cid||pEntries(p.id).some(e=>e.category_id===cid)));$('grid').innerHTML=ps.map(p=>{let s=stats(p.id);return `<div class="player" onclick="openP('${p.id}')"><div class="avatar">${p.photo_url?`<img src="${esc(p.photo_url)}">`:'🏸'}</div><div class="pbody"><b>${esc(p.full_name)}</b><div class="muted">${esc(p.city||'')}</div><div class="record"><div><b>${s[0]}</b><span>Played</span></div><div><b>${s[1]}</b><span>Won</span></div><div><b>${s[2]}</b><span>Lost</span></div></div></div></div>`}).join('')||'<div class="empty">No players found.</div>'}
function openP(pid){let p=registrations.find(x=>x.id===pid),ms=pMatches(pid),s=stats(pid);$('mt').textContent=p.full_name;$('mb').innerHTML=`<p><b>${esc(p.display_name||p.full_name)}</b> · ${esc(p.gender||'')} · ${esc(p.city||'')}</p><div class="grid"><div class="card">Played<b>${s[0]}</b></div><div class="card">Won<b>${s[1]}</b></div><div class="card">Lost<b>${s[2]}</b></div></div><h3>Match History</h3>${ms.length?`<div class="tablewrap"><table class="table"><tr><th>Event</th><th>Match</th><th>Opponent</th><th>Score</th><th>Result</th></tr>${ms.map(m=>{let mine=new Set(pEntries(pid).map(e=>e.id)),my=mine.has(m.entry_a_id)?m.entry_a_id:m.entry_b_id,opp=my===m.entry_a_id?entryName(m.entry_b_id):entryName(m.entry_a_id),res=m.status!=='completed'?'Upcoming':m.winner_entry_id===my?'Won':'Lost';return `<tr><td>${esc(catName(draws.find(d=>d.id===m.draw_id)?.category_id))}</td><td>${m.match_no}</td><td>${esc(opp)}</td><td>${m.status==='completed'?m.score_a+' - '+m.score_b:'—'}</td><td>${res}</td></tr>`}).join('')}</table></div>`:'<div class="empty">No matches yet.</div>'}`;$('modal').classList.add('open')}
</script></body></html>
