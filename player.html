<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PCBL Player Profile</title>
<link rel="stylesheet" href="styles.css?v=21?v=16">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="standalone-page">
<header>
  <div class="brand"><div class="logo">PCBL</div><div><strong>PCBL Tournament</strong><small>Live Badminton Team Event</small></div></div>
  <div class="head-actions"><span id="connection" class="badge">CONNECTING</span><a class="btn ghost" href="live.html">🔴 Live Screen</a><a class="btn ghost" href="admin.html">🔐 Admin</a></div>
</header>
<main>
  <div class="standalone-nav site-nav">
    <a href="index.html">🏠 <span>Dashboard</span></a>
    <a href="live.html">🔴 <span>Live</span></a>
    <a class="active" href="player-stats.html">🏅 <span>Player Stats</span></a>
    <a href="fixtures.html">📅 <span>Fixtures</span></a>
    <a href="teams.html">👥 <span>Teams</span></a>
    <a href="rules_public.html">📖 <span>Rules</span></a>
    <a href="final_format.html">🏆 <span>Finals</span></a>
  </div>
  <div class="page-back"><a class="btn small" href="player-stats.html">← Back to Player Stats</a></div>
  <section class="card player-profile-page">
    <div id="playerProfileLoading" class="profile-loading">Loading player profile…</div>
    <div id="playerProfileError" class="profile-error hidden"></div>
    <div id="playerProfile" class="hidden"></div>
  </section>
</main>
<script src="config.js"></script>
<script src="player-profile.js?v=16"></script>

<nav class="mobile-bottom-nav" aria-label="Mobile navigation"><a href="index.html">🏠<span>Home</span></a><a href="live.html">🔴<span>Live</span></a><a href="player-stats.html">🏅<span>Stats</span></a><a href="fixtures.html">📅<span>Fixtures</span></a><a href="more.html">☰<span>More</span></a></nav>
<script>
(function(){
  function activePage(){
    const q=new URLSearchParams(location.search).get('page');
    if(q) return q;
    const f=location.pathname.split('/').pop().toLowerCase();
    return ({'index.html':'dashboard','live.html':'live','player-stats.html':'playerstats','fixtures.html':'fixtures','teams.html':'teams','rules_public.html':'rules','final_format.html':'finalformat','player.html':'player'})[f]||'dashboard';
  }
  function mark(){const p=activePage();document.querySelectorAll('.mobile-bottom-nav [data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===p));}
  document.addEventListener('click',function(e){if(e.target.closest('.mobile-bottom-nav a')) setTimeout(mark,0);},true);
  window.addEventListener('popstate',mark); mark();
})();
</script>
</body>
</html>
